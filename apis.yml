name: Shift EV
description: 'Shift EV is an electric-mobility company that retrofits existing commercial
  vehicles to electric power through an "electrofitting" service, converting fleet
  vehicles to EV drivetrains in under an hour with zero upfront cost. The company designs
  and installs plug-and-play EV drivetrains, lithium-ion battery packs, on-site charging
  infrastructure, and fleet-management software for FMCG, e-commerce, service, and
  OEM fleets. Backed by Union Square Ventures, Shift EV was added to the API Evangelist
  network as a portfolio company. As of this enrichment pass it publishes no public
  API, developer portal, or machine-readable API surface; this profile captures its
  identity and probed domain-security posture.'
